<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kintsugi — Mended with Gold</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-from: #1a1715;
      --bg-to: #26201b;
      --card-bg: rgba(255, 250, 244, 0.06);
      --card-border: rgba(235, 200, 130, 0.18);
      --text-main: #f7f1e8;
      --text-muted: #c8bcb0;
      --accent-gold: #e5b95c;
      --accent-gold-bright: #f7d98c;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(165deg, var(--bg-from) 0%, var(--bg-to) 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 1.1s ease, color 0.8s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .font-serif-display {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Chapter-specific ambient palettes */
    body.theme-cover {
      --bg-from: #181412;
      --bg-to: #2a211b;
      --card-bg: rgba(255, 248, 238, 0.055);
      --card-border: rgba(229, 185, 92, 0.22);
      --text-main: #f8f2e9;
      --text-muted: #c9bdb0;
    }

    body.theme-ch1 {
      --bg-from: #221a14;
      --bg-to: #33261d;
      --card-bg: rgba(255, 247, 235, 0.075);
      --card-border: rgba(238, 194, 122, 0.25);
      --text-main: #fbf5ec;
      --text-muted: #d5c5b4;
    }

    body.theme-ch2 {
      --bg-from: #14171c;
      --bg-to: #20252d;
      --card-bg: rgba(225, 234, 245, 0.055);
      --card-border: rgba(173, 189, 208, 0.2);
      --text-main: #edf1f6;
      --text-muted: #aeb8c6;
    }

    body.theme-ch3 {
      --bg-from: #1d1915;
      --bg-to: #2f2519;
      --card-bg: rgba(255, 242, 214, 0.065);
      --card-border: rgba(229, 185, 92, 0.3);
      --text-main: #faf3e5;
      --text-muted: #d5c5a8;
    }

    body.theme-ch4 {
      --bg-from: #261d14;
      --bg-to: #3d2c1b;
      --card-bg: rgba(255, 248, 232, 0.09);
      --card-border: rgba(247, 217, 140, 0.42);
      --text-main: #fff9ef;
      --text-muted: #e2d1b7;
    }

    body.theme-ch4-mended {
      --bg-from: #2f2214;
      --bg-to: #4e361c;
      --card-bg: rgba(255, 250, 236, 0.11);
      --card-border: rgba(252, 224, 148, 0.55);
      --text-main: #fffaf0;
      --text-muted: #ecdcc0;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.25s ease, border-color 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
    }

    .glass-card:active {
      transform: scale(0.985);
    }

    .gold-gradient-text {
      background: linear-gradient(125deg, #f9e4a7 0%, #e5b95c 48%, #c99238 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gold-btn {
      background: linear-gradient(135deg, #f3d27d 0%, #d9a441 55%, #b88128 100%);
      color: #1a140e;
      box-shadow: 0 8px 26px rgba(217, 164, 65, 0.28);
      transition: transform 0.2s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .gold-btn:hover {
      filter: brightness(1.06);
      box-shadow: 0 10px 30px rgba(243, 210, 125, 0.38);
    }

    .gold-btn:active {
      transform: scale(0.97);
    }

    .fade-up {
      animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Kintsugi SVG crack animations */
    .crack-base {
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: opacity 0.6s ease, stroke 0.6s ease;
    }

    .crack-gold {
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 240;
      stroke-dashoffset: 240;
      transition: stroke-dashoffset 1.6s cubic-bezier(0.25, 0.9, 0.35, 1), opacity 0.6s ease;
    }

    .crack-hit {
      cursor: pointer;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(243, 210, 125, 0.35)); }
      50% { filter: drop-shadow(0 0 16px rgba(247, 217, 140, 0.8)); }
    }

    .vessel-mended-glow {
      animation: pulseGlow 3.2s ease-in-out infinite;
    }

    .hold-fill {
      transition: width 0.08s linear;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(229, 185, 92, 0.25);
      border-radius: 999px;
    }
  </style>
</head>

            "I'm not saying you're wrong or blaming you for anything—I just want you to remember: tu jasi aahes, tashi khup changli aahes g majha sathi ❤️🥰✨ You don't have to be perfect, and you don't have to handle everything alone.",

    };

    /* =========================================================================
       APP STATE
       ========================================================================= */
    const state = {
      step: 0, // 0 = Cover, 1 = Started, 2 = Hurts, 3 = Intentions, 4 = Fresh Start
      soundEnabled: true,
      revealedMemories: new Set(),
      acknowledgedCracks: new Set(),
      collectedIntentions: new Set(),
      isMended: false,
      promiseSealed: false
    };

    /* =========================================================================
       GENTLE WEB AUDIO SYNTH (Pentatonic Warm Chimes, Zero External Files)
       ========================================================================= */
    let audioCtx = null;

    function getAudioCtx() {
      if (!state.soundEnabled) return null;
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return null;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playChime(freq = 523.25, duration = 0.55, volume = 0.08) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.05);
      } catch (e) {
        // Ignore audio autoplay errors silently
      }
    }

    function playGoldenArpeggio() {
      const notes = [392.0, 493.88, 587.33, 739.99, 880.0];
      notes.forEach((n, idx) => {
        setTimeout(() => playChime(n, 0.9, 0.075), idx * 120);
      });
    }

    /* =========================================================================
       AMBIENT GOLD DUST CANVAS
       ========================================================================= */
    const canvas = document.getElementById("ambientCanvas");
    const ctx2d = canvas ? canvas.getContext("2d") : null;
    let particles = [];
    let burstParticles = [];

    function resizeCanvas() {
      if (!canvas || !ctx2d) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initParticles() {
      particles = [];
      const count = 34;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.8 + 0.6,
          vy: -(Math.random() * 0.25 + 0.08),
          vx: (Math.random() - 0.5) * 0.16,
          alpha: Math.random() * 0.45 + 0.15,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function spawnGoldBurst(originX, originY, count = 28) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = Math.random() * 2.6 + 0.9;
        burstParticles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.8,
          r: Math.random() * 2.6 + 1.2,
          life: 1.0,
          decay: Math.random() * 0.014 + 0.01
        });
      }
    }

    function animateAmbient() {
      if (!ctx2d) return;
      ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight);
      const isCool = state.step === 2;
      const isBrightGold = state.step === 4 && state.isMended;

      for (const p of particles) {
        p.y += p.vy * (isBrightGold ? 1.5 : 1);
        p.x += p.vx + Math.sin(p.phase) * 0.12;
        p.phase += 0.015;
        if (p.y < -10) {
          p.y = window.innerHeight + 10;
          p.x = Math.random() * window.innerWidth;
        }
        const twinkle = 0.65 + 0.35 * Math.sin(p.phase * 2);
        const color = isCool
          ? `rgba(186, 205, 228, ${p.alpha * twinkle * 0.7})`
          : isBrightGold
            ? `rgba(250, 222, 138, ${Math.min(0.95, p.alpha * twinkle * 1.6)})`
            : `rgba(235, 195, 110, ${p.alpha * twinkle})`;

        ctx2d.beginPath();
        ctx2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx2d.fillStyle = color;
        ctx2d.fill();
      }

      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const b = burstParticles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.025;
        b.life -= b.decay;
        if (b.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }
        ctx2d.beginPath();
        ctx2d.arc(b.x, b.y, b.r * b.life, 0, Math.PI * 2);
        ctx2d.fillStyle = `rgba(250, 218, 128, ${b.life})`;
        ctx2d.fill();
      }

      requestAnimationFrame(animateAmbient);
    }

    /* =========================================================================
       TOAST HELPER
       ========================================================================= */
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.remove("opacity-0", "translate-y-2");
      el.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add("opacity-0", "translate-y-2");
        el.classList.remove("opacity-100", "translate-y-0");
      }, 2400);
    }

    /* =========================================================================
       VESSEL VISUAL STATE UPDATER
       ========================================================================= */
    function updateVesselVisuals() {
      const vesselStage = document.getElementById("vesselStage");
      const cracksGroup = document.getElementById("cracksGroup");
      const vesselBody = document.getElementById("vesselBody");
      const vesselCaption = document.getElementById("vesselCaption");
      const kintsugiSvg = document.getElementById("kintsugiSvg");
      if (!vesselStage || !cracksGroup || !vesselBody || !vesselCaption || !kintsugiSvg) return;

      if (state.step === 0) {
        vesselStage.classList.add("hidden");
        vesselStage.classList.remove("flex");
        return;
      }

      vesselStage.classList.remove("hidden");
      vesselStage.classList.add("flex");

      // Ceramic fill tone changes subtly in Chapter 2
      vesselBody.setAttribute("fill", state.step === 2 ? "url(#ceramicCool)" : "url(#ceramicFill)");

      // Cracks hidden in Chapter 1, visible in Chapters 2-4
      if (state.step === 1) {
        cracksGroup.classList.add("opacity-0");
        cracksGroup.classList.remove("opacity-100");
        vesselCaption.textContent = STORY_CONFIG.chapters.started.vesselHint;
      } else {
        cracksGroup.classList.remove("opacity-0");
        cracksGroup.classList.add("opacity-100");
      }

      // Update each crack's gold seam progression
      for (let i = 0; i < 3; i++) {
        const base = document.getElementById(`crackBase${i}`);
        const gold = document.getElementById(`crackGold${i}`);
        if (!base || !gold) continue;
        const ack = state.acknowledgedCracks.has(i);

        if (state.step === 2) {
          gold.style.opacity = ack ? "0.45" : "0";
          gold.style.strokeDashoffset = ack ? "140" : "240";
          base.style.stroke = ack ? "#8ea4bf" : "#0b0d11";
        } else if (state.step === 3) {
          const collectedCount = state.collectedIntentions.size;
          const partialOffset = Math.max(40, 240 - collectedCount * 50);
          gold.style.opacity = collectedCount > 0 ? "0.75" : "0.15";
          gold.style.strokeDashoffset = String(partialOffset);
          base.style.stroke = "#181410";
        } else if (state.step === 4) {
          if (state.isMended) {
            gold.style.opacity = "1";
            gold.style.strokeDashoffset = "0";
            base.style.stroke = "#3a2915";
          } else {
            gold.style.opacity = "0.45";
            gold.style.strokeDashoffset = "165";
            base.style.stroke = "#120f0c";
          }
        }
      }

      if (state.step === 2) {
        vesselCaption.textContent = `${STORY_CONFIG.chapters.hurts.vesselHint} (${state.acknowledgedCracks.size}/3)`;
      } else if (state.step === 3) {
        vesselCaption.textContent = `${STORY_CONFIG.chapters.intentions.vesselHint} (${state.collectedIntentions.size}/${STORY_CONFIG.chapters.intentions.items.length} drops)`;
      } else if (state.step === 4) {
        vesselCaption.textContent = state.isMended
          ? STORY_CONFIG.chapters.freshStart.vesselHintMended
          : STORY_CONFIG.chapters.freshStart.vesselHintUnmended;
      }

      if (state.step === 4 && state.isMended) {
        kintsugiSvg.classList.add("vessel-mended-glow");
      } else {
        kintsugiSvg.classList.remove("vessel-mended-glow");
      }
    }

    /* =========================================================================
       BODY THEME & STEPPER UPDATER
       ========================================================================= */
    function updateThemeAndNav() {
      document.body.classList.remove(
        "theme-cover",
        "theme-ch1",
        "theme-ch2",
        "theme-ch3",
        "theme-ch4",
        "theme-ch4-mended"
      );

      if (state.step === 0) document.body.classList.add("theme-cover");
      else if (state.step === 1) document.body.classList.add("theme-ch1");
      else if (state.step === 2) document.body.classList.add("theme-ch2");
      else if (state.step === 3) document.body.classList.add("theme-ch3");
      else if (state.step === 4) document.body.classList.add(state.isMended ? "theme-ch4-mended" : "theme-ch4");

      const nav = document.getElementById("chapterNav");
      if (nav) {
        if (state.step === 0) nav.classList.add("hidden");
        else nav.classList.remove("hidden");
      }

      document.querySelectorAll(".step-pill").forEach((pill) => {
        const s = Number(pill.dataset.step);
        const barFill = pill.querySelector(".step-bar-fill");
        const label = pill.querySelector(".step-label");
        if (!barFill || !label) return;

        if (s < state.step) {
          barFill.style.width = "100%";
          label.className = "step-label text-[10px] tracking-wide text-amber-200/90 truncate max-w-full";
        } else if (s === state.step) {
          barFill.style.width = "100%";
          label.className = "step-label text-[10px] tracking-wide text-amber-300 font-semibold truncate max-w-full";
        } else {
          barFill.style.width = "0%";
          label.className = "step-label text-[10px] tracking-wide text-stone-400/75 truncate max-w-full";
        }
      });
    }

    /* =========================================================================
       CHAPTER RENDERERS
       ========================================================================= */
    function render() {
      try {
        updateThemeAndNav();
        updateVesselVisuals();

        const stage = document.getElementById("stageContent");
        if (!stage) return;
        stage.innerHTML = "";

        if (state.step === 0) renderCover(stage);
        else if (state.step === 1) renderChapter1(stage);
        else if (state.step === 2) renderChapter2(stage);
        else if (state.step === 3) renderChapter3(stage);
        else if (state.step === 4) renderChapter4(stage);
      } catch (err) {
        console.error("Render error:", err);
      }
    }

    function renderChapter1(stage) {
      const ch = STORY_CONFIG.chapters.started;
      const cardsHtml = ch.memories.map((m) => {
        const opened = state.revealedMemories.has(m.id);
        return `
          <button type="button" data-mem="${m.id}" class="memory-card w-full text-left glass-card rounded-2xl p-4 transition ${opened ? "border-amber-300/50 bg-amber-200/10" : "hover:border-amber-300/35"}">

      stage.innerHTML = `

            <button id="nextBtn" type="button" class="${allOpened ? "gold-btn" : "glass-card text-amber-100 border-amber-300/35"} flex-1 py-3.5 px-5 rounded-2xl text-sm font-semibold transition">
              ${allOpened ? "Continue to Chapter II →" : `Next Chapter (${state.revealedMemories.size}/${ch.memories.length} opened) →`}

      stage.querySelectorAll(".memory-card").forEach((btn) => {

          if (!state.revealedMemories.has(id)) {

            playChime(587.33 + state.revealedMemories.size * 55, 0.5);

            playChime(440, 0.35, 0.05);

      document.getElementById("nextBtn").addEventListener("click", () => {
        playChime(440, 0.55);
        state.step = 2;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

    function renderChapter2(stage) {
      const ch = STORY_CONFIG.chapters.hurts;
      const cardsHtml = ch.cracks.map((c) => {
        const ack = state.acknowledgedCracks.has(c.id);
        return `
          <button type="button" data-crack-card="${c.id}" class="crack-card w-full text-left glass-card rounded-2xl p-4 transition ${ack ? "border-sky-200/40 bg-sky-200/10" : "hover:border-slate-300/35"}">

              <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full ${ack ? "bg-amber-300/20 text-amber-200" : "bg-white/10 text-slate-300"}">${ack ? "Acknowledged" : "Tap Crack"}</span>
            </div>
            ${ack ? `
              <p class="text-sm leading-relaxed text-slate-100/90 mt-1.5 fade-up">${c.note}</p>
            ` : `
              <p class="text-xs text-slate-400 mt-1">Tap to open this honest reflection.</p>
            `}
          </button>
        `;
      }).join("");

      const allAck = state.acknowledgedCracks.size === ch.cracks.length;

      stage.innerHTML = `
        <div class="fade-up flex-1 flex flex-col">
          <div class="text-center mb-4">
            <p class="text-[11px] uppercase tracking-[0.22em] text-slate-300/75">${ch.tag}</p>
            <h2 class="font-serif-display text-3xl font-semibold text-slate-100 mt-0.5">${ch.title}</h2>
            <p class="text-xs text-slate-300/80 mt-1">${ch.subtitle}</p>
          </div>

          <div class="space-y-3 mb-6">
            ${cardsHtml}
          </div>

          <div class="mt-auto pt-2 flex items-center gap-2.5">
            <button id="backBtn" type="button" class="glass-card px-4 py-3.5 rounded-2xl text-xs font-medium text-slate-200">←</button>
            <button id="nextBtn" type="button" class="${allAck ? "gold-btn" : "glass-card text-slate-100 border-slate-300/30"} flex-1 py-3.5 px-5 rounded-2xl text-sm font-semibold transition">
              ${allAck ? "See My Intentions →" : `Continue (${state.acknowledgedCracks.size}/3 acknowledged) →`}
            </button>

        state.step = 3;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    function toggleCrack(id) {
      if (!state.acknowledgedCracks.has(id)) {
        state.acknowledgedCracks.add(id);
        playChime(392 + id * 45, 0.55, 0.065);
      } else {
        state.acknowledgedCracks.delete(id);
      }
      render();
    }

    function renderChapter3(stage) {
      const ch = STORY_CONFIG.chapters.intentions;
      const total = ch.items.length;
      const collected = state.collectedIntentions.size;
      const pct = Math.round((collected / total) * 100);

      const cardsHtml = ch.items.map((item) => {
        const kept = state.collectedIntentions.has(item.id);
        return `
          <div data-intent="${item.id}" role="button" tabindex="0" class="intent-card relative overflow-hidden glass-card rounded-2xl p-4 cursor-pointer select-none ${kept ? "border-amber-300/60 bg-amber-300/10" : "hover:border-amber-300/40"}">
            <div class="hold-fill absolute inset-y-0 left-0 bg-gradient-to-r from-amber-400/25 to-amber-200/15 pointer-events-none" style="width: ${kept ? "100%" : "0%"};"></div>
            <div class="relative z-10">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="text-sm font-semibold text-amber-100">${item.title}</span>
                <span class="text-[11px] font-medium ${kept ? "text-amber-300" : "text-amber-200/60"}">${kept ? "✦ Kept" : "Hold / Tap"}</span>
              </div>
              <p class="text-xs leading-relaxed text-stone-200/90">${item.detail}</p>
            </div>
          </div>
        `;
      }).join("");

      const allKept = collected === total;

      stage.innerHTML = `
        <div class="fade-up flex-1 flex flex-col">
          <div class="text-center mb-3">
            <p class="text-[11px] uppercase tracking-[0.22em] text-amber-200/80">${ch.tag}</p>
            <h2 class="font-serif-display text-3xl font-semibold gold-gradient-text mt-0.5">${ch.title}</h2>
            <p class="text-xs text-stone-300/85 mt-1">${ch.subtitle}</p>
          </div>

          <!-- Liquid Gold Bowl Progress -->
          <div class="glass-card rounded-xl px-3.5 py-2.5 mb-4">
            <div class="flex items-center justify-between text-[11px] mb-1.5">
              <span class="text-amber-200/85 font-medium">Liquid Gold Collected</span>
              <span class="text-amber-300 font-semibold">${collected} / ${total} drops</span>
            </div>
            <div class="w-full h-2 rounded-full bg-black/35 overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-r from-amber-500 via-amber-300 to-yellow-200 transition-all duration-500" style="width: ${pct}%;"></div>
            </div>
          </div>

          <div class="space-y-2.5 mb-6">
            ${cardsHtml}
          </div>

          <div class="mt-auto pt-2 flex items-center gap-2.5">
            <button id="backBtn" type="button" class="glass-card px-4 py-3.5 rounded-2xl text-xs font-medium text-stone-200">←</button>
            <button id="nextBtn" type="button" class="${allKept ? "gold-btn" : "glass-card text-amber-100 border-amber-300/35"} flex-1 py-3.5 px-5 rounded-2xl text-sm font-semibold transition">
              ${allKept ? "Ready for Our Fresh Start →" : "Continue to Fresh Start →"}
            </button>
          </div>
        </div>
      `;

      // Support both press-and-hold and quick tap for effortless mobile UX
      stage.querySelectorAll(".intent-card").forEach((card) => {
        const id = card.dataset.intent;
        const fill = card.querySelector(".hold-fill");
        let holdInterval = null;
        let progress = 0;

        function completeKeep() {
          clearInterval(holdInterval);
          holdInterval = null;
          if (!state.collectedIntentions.has(id)) {
            state.collectedIntentions.add(id);
            playChime(523.25 + state.collectedIntentions.size * 70, 0.65, 0.085);
            const rect = card.getBoundingClientRect();
            spawnGoldBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 16);
            render();
          }
        }

        function startHold() {
          if (state.collectedIntentions.has(id)) return;
          progress = 15;
          if (fill) fill.style.width = `${progress}%`;
          clearInterval(holdInterval);
          holdInterval = setInterval(() => {
            progress += 14;
            if (fill) fill.style.width = `${Math.min(100, progress)}%`;
            if (progress >= 100) {
              completeKeep();
            }
          }, 45);
        }

        function cancelOrTap() {
          if (holdInterval) {
            clearInterval(holdInterval);
            holdInterval = null;
            completeKeep();
          }
        }

        card.addEventListener("pointerdown", startHold);
        card.addEventListener("pointerup", cancelOrTap);
        card.addEventListener("pointercancel", () => {
          clearInterval(holdInterval);
          holdInterval = null;
          if (!state.collectedIntentions.has(id) && fill) fill.style.width = "0%";
        });
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            completeKeep();
          }
        });
      });

      document.getElementById("backBtn").addEventListener("click", () => {
        state.step = 2;
        render();
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        playChime(659.25, 0.6);
        state.step = 4;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    function renderChapter4(stage) {
      const ch = STORY_CONFIG.chapters.freshStart;
      const todayLabel = new Date().toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",

      });

      if (!state.isMended) {
        stage.innerHTML = `

        document.getElementById("mendBtn").addEventListener("click", triggerMend);
        document.getElementById("backBtn").addEventListener("click", () => {

      } else {

        stage.innerHTML = `
          <div class="fade-up flex-1 flex flex-col">
            <div class="text-center mb-4">
              <p class="text-[11px] uppercase tracking-[0.22em] text-amber-200">${ch.tag} · Mended</p>
              <h2 class="font-serif-display text-3xl font-semibold gold-gradient-text mt-0.5">${ch.letterHeading}</h2>
            </div>

            <article class="glass-card rounded-3xl p-5 space-y-3.5 mb-5 border-amber-300/45 shadow-xl shadow-amber-950/35">
              ${paragraphsHtml}
              <div class="pt-3 border-t border-amber-200/20 flex items-center justify-between text-xs text-amber-200/85">
                <span class="font-serif-display italic text-base">— Always, ${STORY_CONFIG.senderName}</span>
                <span class="text-[11px] opacity-80">${todayLabel}</span>
              </div>
            </article>

            ${!state.promiseSealed ? `
              <button id="sealPromiseBtn" type="button" class="gold-btn w-full py-3.5 px-6 rounded-2xl text-sm font-semibold mb-3">
                ✦ ${ch.promiseButton}
              </button>
            ` : `
              <div class="glass-card border-amber-300/60 bg-amber-300/15 rounded-2xl p-3.5 text-center mb-3 fade-up">
                <p class="text-xs font-semibold text-amber-200">✦ ${ch.promiseSealedText}</p>
                <p class="text-[11px] text-amber-100/75 mt-0.5">${todayLabel}</p>
              </div>
            `}

            <div class="mt-auto flex items-center justify-between gap-2 pt-1">
              <button id="backBtn" type="button" class="glass-card px-4 py-2.5 rounded-xl text-xs text-amber-100/85">← Intentions</button>
              <button id="replayBtn" type="button" class="glass-card px-4 py-2.5 rounded-xl text-xs text-amber-100/85">Replay Story ↺</button>
            </div>
          </div>
        `;

        const sealBtn = document.getElementById("sealPromiseBtn");
        if (sealBtn) {
          sealBtn.addEventListener("click", () => {
            state.promiseSealed = true;
            playGoldenArpeggio();
            spawnGoldBurst(window.innerWidth / 2, window.innerHeight * 0.6, 36);
            showToast("Fresh start sealed in gold ✦");
            render();
          });
        }

        document.getElementById("backBtn").addEventListener("click", () => {
          state.step = 3;
          render();
        });

        document.getElementById("replayBtn").addEventListener("click", () => {
          state.step = 0;
          state.revealedMemories.clear();
          state.acknowledgedCracks.clear();
          state.collectedIntentions.clear();
          state.isMended = false;
          state.promiseSealed = false;
          playChime(523.25, 0.5);
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    }

    function triggerMend() {
      if (state.isMended) return;
      state.isMended = true;
      playGoldenArpeggio();
      const svgEl = document.getElementById("kintsugiSvg");
      if (svgEl) {
        const svgRect = svgEl.getBoundingClientRect();
        spawnGoldBurst(svgRect.left + svgRect.width / 2, svgRect.top + svgRect.height / 2, 42);
      }
      showToast("Mended with gold ✦");
      render();
    }

    /* =========================================================================
       GLOBAL EVENT LISTENERS & SAFE INITIALIZATION
       ========================================================================= */
    function initApp() {
      const homeLogoBtn = document.getElementById("homeLogoBtn");
      if (homeLogoBtn) {
        homeLogoBtn.addEventListener("click", () => {
          state.step = 0;
          render();
        });
      }

      const soundToggleBtn = document.getElementById("soundToggleBtn");
      if (soundToggleBtn) {
        soundToggleBtn.addEventListener("click", () => {
          state.soundEnabled = !state.soundEnabled;
          const lbl = document.getElementById("soundLabel");
          const icn = document.getElementById("soundIcon");
          if (lbl) lbl.textContent = state.soundEnabled ? "Sound On" : "Muted";
          if (icn) icn.textContent = state.soundEnabled ? "♪" : "✕";
          if (state.soundEnabled) playChime(659.25, 0.35, 0.06);
        });
      }

      document.querySelectorAll(".step-pill").forEach((pill) => {
        pill.addEventListener("click", () => {
          const target = Number(pill.dataset.step);
          state.step = target;
          playChime(440 + target * 55, 0.4, 0.05);
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      // Allow tapping directly on the SVG cracks in Chapter 2 or vessel in Chapter 4
      document.querySelectorAll(".crack-hit").forEach((path) => {
        path.addEventListener("click", () => {
          if (state.step === 2) {
            toggleCrack(Number(path.dataset.crack));
          } else if (state.step === 4 && !state.isMended) {
            triggerMend();
          }
        });
      });

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
      initParticles();
      animateAmbient();
      render();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
